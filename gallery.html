<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Connection Life Church Berlin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/CSS/base.css">
    <link rel="stylesheet" href="assets/CSS/gallery.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
 <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <div class="logo-container">
                <div class="logo-icon"><img src="assets/images/logo.svg" alt="Connection Life Church Berlin logo"></div>
                <div class="logo-text">
                    <div class="logo-main">
                        <span class="logo-connection">Connection</span>
                        <span class="logo-life">Life</span>
                        <span class="logo-church">Church</span>
                        <span class="logo-berlin">Berlin</span>
                    </div>
                    <div class="logo-tagline">Connecting Upward, Inward, & Outward</div>
                </div>
            </div>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About-Us</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="hamburger" onclick="toggleMenu()">
                <span></span>      
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="page-hero"> 
            <h1>Our Church Gallery</h1>
            <p>Capturing moments of worship, fellowship, and community</p>    
    </section>
 
 
    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="gallery-grid">
            <!-- Gallery items will be populated dynamically -->
        </div>
    </section>
 
    <!-- Lightbox -->
    <div class="lightbox">
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightbox-image" src="" alt="">
                <button class="close-btn" onclick="closeLightboxModal()">
                    <i class="fas fa-times"></i>
                </button>
                <button class="nav-btn prev-btn" onclick="prevImage()">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="nav-btn next-btn" onclick="nextImage()">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <div class="lightbox-info">
                <h3></h3>
                <p class="date"></p>
            </div>
        </div>
    </div>
 
    <script>
        // Gallery data (auto-populated with all images in assets/images)
        const galleryData = [
            // IMG series
           
            { id: 2, image: 'assets/images/IMG-20251023-WA0002.jpg', title: 'IMG-20251023-WA0002', date: '', category: 'all' },
            { id: 3, image: 'assets/images/IMG-20251023-WA0003.jpg', title: 'IMG-20251023-WA0003', date: '', category: 'all' },
            { id: 4, image: 'assets/images/IMG-20251023-WA0004.jpg', title: 'IMG-20251023-WA0004', date: '', category: 'all' },
            { id: 5, image: 'assets/images/IMG-20251023-WA0005.jpg', title: 'IMG-20251023-WA0005', date: '', category: 'all' },
            { id: 6, image: 'assets/images/IMG-20251023-WA0006.jpg', title: 'IMG-20251023-WA0006', date: '', category: 'all' },
            { id: 7, image: 'assets/images/IMG-20251023-WA0007.jpg', title: 'IMG-20251023-WA0007', date: '', category: 'all' },
            { id: 9, image: 'assets/images/IMG-20251023-WA0009.jpg', title: 'IMG-20251023-WA0009', date: '', category: 'all' },
            { id: 10, image: 'assets/images/IMG-20251023-WA0010.jpg', title: 'IMG-20251023-WA0010', date: '', category: 'all' },
            { id: 11, image: 'assets/images/IMG-20251023-WA0011.jpg', title: 'IMG-20251023-WA0011', date: '', category: 'all' },           
            { id: 14, image: 'assets/images/IMG-20251023-WA0014.jpg', title: 'IMG-20251023-WA0014', date: '', category: 'all' },           
            { id: 22, image: 'assets/images/IMG-20251023-WA0022.jpg', title: 'IMG-20251023-WA0022', date: '', category: 'all' },       
            { id: 25, image: 'assets/images/IMG-20251023-WA0025.jpg', title: 'IMG-20251023-WA0025', date: '', category: 'all' },
            { id: 26, image: 'assets/images/IMG-20251023-WA0026.jpg', title: 'IMG-20251023-WA0026', date: '', category: 'all' },     
            { id: 28, image: 'assets/images/IMG-20251023-WA0028.jpg', title: 'IMG-20251023-WA0028', date: '', category: 'all' },
            { id: 29, image: 'assets/images/IMG-20251023-WA0029.jpg', title: 'IMG-20251023-WA0029', date: '', category: 'all' },
            { id: 33, image: 'assets/images/IMG-20251023-WA0033.jpg', title: 'IMG-20251023-WA0033', date: '', category: 'all' },
           
           
        ];
 
        // Populate gallery grid
        const galleryGrid = document.querySelector('.gallery-grid');
         
        function createGalleryItem(item) {
            return `
                <div class="gallery-item" data-category="${item.category}">
                    <div class="gallery-item-inner">
                        <img src="${item.image}" alt="${item.title}" loading="lazy" decoding="async">
                        <div class="gallery-overlay">
                            <div class="gallery-info">
                                <h3>${item.title}</h3>
                                <p class="gallery-date">${item.date}</p>
                            </div>
                            <button class="view-btn" onclick="openLightbox(${item.id})">
                                <i class="fas fa-expand"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
 
        function renderGallery(items = galleryData) {
            galleryGrid.innerHTML = items.map(item => createGalleryItem(item)).join('');
        }
 
        // Filter functionality
        const filterButtons = document.querySelectorAll('.filter-btn');
         
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active state
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
 
                // Filter gallery items
                const category = btn.textContent.trim().toLowerCase();
                const filteredItems = category === 'all' 
                    ? galleryData 
                    : galleryData.filter(item => item.category === category);
                 
                renderGallery(filteredItems);
            });
        });
 
        // Lightbox functionality
        const lightbox = document.querySelector('.lightbox');
        const lightboxImage = document.querySelector('#lightbox-image');
        const lightboxTitle = document.querySelector('.lightbox-info h3');
        const lightboxDate = document.querySelector('.lightbox-info .date');
        const closeBtn = document.querySelector('.close-btn');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
         
        let currentImageIndex = 0;
 
        function openLightbox(imageId) {
            currentImageIndex = galleryData.findIndex(item => item.id === imageId);
            updateLightboxContent();
            lightbox.classList.add('active');
        }
 
        function updateLightboxContent() {
            const item = galleryData[currentImageIndex];
            lightboxImage.src = item.image;
            lightboxTitle.textContent = item.title;
            lightboxDate.textContent = item.date;
        }
 
        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });
 
        prevBtn.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex - 1 + galleryData.length) % galleryData.length;
            updateLightboxContent();
        });
 
        nextBtn.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex + 1) % galleryData.length;
            updateLightboxContent();
        });
 
        // Close lightbox on overlay click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });

        // Add functions for onclick handlers
        function closeLightboxModal() {
            lightbox.classList.remove('active');
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + galleryData.length) % galleryData.length;
            updateLightboxContent();
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % galleryData.length;
            updateLightboxContent();
        }
 
        // Initialize gallery
        renderGallery();
    </script>
 </body>
 </html>
